# Dotbot config for the Windows setup.
# Run with: .\install.ps1  (requires Python; symlinks need Developer Mode or admin)

- defaults:
    link:
      create: true
      relink: true

- clean: ["~/.claude"]

- link:
    ~/.claude/CLAUDE.md: claude/CLAUDE.md
    ~/.claude/settings.json: claude/settings.json
    ~/.claude/skills: claude/skills
